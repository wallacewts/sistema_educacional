<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema Educacional</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 900px;
        margin: 60px auto;
        padding: 0 20px;
        color: #222;
      }

      h1 {
        margin-bottom: 10px;
      }

      .menu {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        margin-top: 30px;
      }

      .menu a {
        display: block;
        padding: 18px 24px;
        border: 1px solid #ddd;
        border-radius: 8px;
        color: #174ea6;
        text-decoration: none;
      }

      .menu a:hover {
        background: #f3f6fc;
      }
    </style>
  </head>
  <body>
    <h1>Sistema Educacional</h1>
    <p>Gerencie os alunos e cursos da instituição.</p>

    <nav class="menu">
      <a href="{% url 'listar_alunos' %}">
        <strong>Alunos</strong>
        <p>Consultar alunos cadastrados</p>
      </a>

      <a href="{% url 'listar_cursos' %}">
        <strong>Cursos</strong>
        <p>Consultar cursos e matrículas</p>
      </a>

      <a href="{% url 'admin:index' %}">
        <strong>Administração</strong>
        <p>Acessar o Django Admin</p>
      </a>
    </nav>
  </body>
</html>
